async function mutate(path,data){

function standings(matches=finishedMatches()){

    const rows=matches.flatMap(m=>m.entries.filter(e=>e.player_id===p.id));

async function share(){if(readOnly){openModal('分享这份积分存档','只读快照，无需连接记分服务器。',`<label class="field">存档网址<input id="share-url" readonly value="${esc(location.href.split('#')[0])}"></label>`,`<span class="hint">版本 R${state.revision}</span><button class="btn primary" data-action="copy-link">复制链接</button>`);return;}const url=location.origin;const local=['localhost','127.0.0.1'].includes(location.hostname);modalState={type:'share'};openModal('把朋友们，聚到同一张桌。','访问同一个服务地址，即可共同编辑。',`<label class="field">当前记分册地址<input id="share-url" readonly value="${esc(url)}"></label><p class="hint" style="margin-top:14px">${local?'当前为本机预览地址。让同一 Wi-Fi 下的朋友使用这台电脑的局域网 IP 加端口访问；互联网共享需要将服务部署到公网。':'将这个链接发给朋友。他们可以直接添加选手、创建比赛和修改成绩。'}</p>`,`<span class="hint">无需登录 · 数据共同维护</span><button class="btn primary" data-action="copy-link">复制链接</button>`);}
async function action(a){
  if(a==='new-match')matchEditor();else if(a==='new-player')playerEditor();else if(a==='close')closeModal();else if(a==='rules')rules();else if(a==='archive')archiveInfo();else if(a==='identity')identity();else if(a==='export')exportBoard();else if(a==='share')share();else if(a==='reload')refresh(true);else if(a.startsWith('leader:'))playerDetail(a.slice(7));else if(a==='copy-link'){try{await navigator.clipboard.writeText($('#share-url').value);toast('链接已复制');}catch{$('#share-url').select();toast('请复制已选中的链接');}}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-match],[data-player]');if(!el)return;
  if(readOnly && (el.dataset.editMatch || el.dataset.editPlayer || el.dataset.deleteMatch || el.dataset.confirmDelete))return;
  if(el.dataset.view){view=el.dataset.view;query='';history.replaceState(null,'','#'+view);render();}
  else if(el.dataset.action)action(el.dataset.action);
  else if(el.dataset.period){period=el.dataset.period;render();}
  else if(el.dataset.filter){matchFilter=el.dataset.filter;render();}
  else if(el.dataset.editMatch)matchEditor(el.dataset.editMatch);
  else if(el.dataset.editPlayer)playerEditor(el.dataset.editPlayer);
  else if(el.dataset.exportMatch)exportMatch(el.dataset.exportMatch);
  else if(el.dataset.deleteMatch){const m=modalState.item;modalState={type:'delete',item:m};openModal('删除这场比赛？',esc(m.name),'<p class="rules">比赛及其成绩将被删除，相关选手的总积分也会重新计算。此操作无法撤销。</p>',`<button class="btn" data-match="${m.id}">保留比赛</button><button class="btn danger" data-confirm-delete="${m.id}">确认删除</button>`);}
  else if(el.dataset.confirmDelete)mutate('/api/matches/delete',{id:modalState.item.id,version:modalState.item.version});
  else if(el.dataset.match)matchDetail(el.dataset.match);
  else if(el.dataset.player)playerDetail(el.dataset.player);
});
document.addEventListener('keydown',e=>{const el=e.target.closest('article[role="button"]');if(el && ['Enter',' '].includes(e.key)){e.preventDefault();el.click();}});
document.addEventListener('input',e=>{
  if(e.target.dataset.search){query=e.target.value;render();}
  if(e.target.dataset.entry && modalState?.type==='match'){const {entry,field}=e.target.dataset;const item=modalState.entries.get(entry);item[field]=field==='note'?e.target.value:(e.target.value===''?'':Number(e.target.value));$(`[data-score="${entry}"]`).innerHTML=scoreSpan(Math.round((item.cashout-item.buyin)*100)/100);updateBalance();}
});
document.addEventListener('change',e=>{const id=e.target.dataset.selectPlayer;if(id && modalState?.type==='match'){if(e.target.checked)modalState.entries.set(id,{player_id:id,buyin:0,cashout:0,note:''});else modalState.entries.delete(id);renderEntryEditor();}});
document.addEventListener('submit',e=>{
  if(e.target.id!=='editor-form')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));$('#form-error').textContent='';
  if(modalState.type==='identity'){actor=d.actor.trim()||'访客';try{localStorage.setItem('allin-actor',actor);}catch{}closeModal();render();toast('编辑昵称已更新');}
  else if(modalState.type==='player')mutate('/api/players/save',{...d,id:modalState.item?.id||'',version:modalState.item?.version,archived:d.archived==='true'});
  else if(modalState.type==='match'){if(modalState.entries.size<2){$('#form-error').textContent='请至少选择两位参赛选手';return;}mutate('/api/matches/save',{...d,id:modalState.item?.id||'',version:modalState.item?.version,entries:[...modalState.entries.values()]});}
});
$('#modal').addEventListener('cancel',e=>{if(saving)e.preventDefault();else modalState=null;});
$('#modal').addEventListener('close',()=>{modalState=null;});
window.addEventListener('hashchange',()=>{view=labels[location.hash.slice(1)]?location.hash.slice(1):'overview';query='';render();});
view=labels[location.hash.slice(1)]?location.hash.slice(1):'overview';
refresh(true);if(!readOnly)setInterval(()=>refresh(),5000);


function applyStaticView(){
  $$('[data-action="new-match"],[data-action="new-player"],[data-action="identity"],[data-edit-match],[data-edit-player],[data-delete-match],[data-confirm-delete]').forEach(el=>el.remove());
  $('.side-bottom').textContent='只读存档 · 每一局都有记录';
  $('#sync').innerHTML=`<i></i>存档 R${state.revision}`;
  $('#sync').title='生成于 '+new Date(STATIC.createdAt).toLocaleString('zh-CN');
  $('footer span:last-child').textContent=`只读快照 · ${new Date(STATIC.createdAt).toLocaleString('zh-CN')}`;
  const archiveButton=$('[data-action="archive"]');if(archiveButton)archiveButton.outerHTML=`<a class="quiet" href="${esc(STATIC.historyUrl)}">历史存档 ↗</a>`;
  if($('.callout'))$('.callout').innerHTML=`<div class="callout-title">每一次更新，都有存档 <span>↗</span></div><p>这是 R${state.revision} 的只读快照。可查看总榜、逐场成绩和选手战绩；数据以存档生成时为准。</p><a class="btn" href="${esc(STATIC.historyUrl)}">查看历史存档</a>`;
  $$('.match-card-bottom > span').forEach(el=>el.textContent='查看成绩 →');
  const ruleLast=$('.rules p:last-child');if(modalState?.type==='rules' && ruleLast)ruleLast.textContent='这是只读静态存档。成绩在记分网页中更新后生成新版本，历史存档保留当时的数据。';
  const detailHint=$('.modal-foot > .hint');if(detailHint && modalState?.type==='player-detail')detailHint.textContent='成绩以本次存档生成时为准';
}
async function archiveInfo(){
  modalState={type:'archive'};
  openModal('静态存档与 GitHub 发布','每次保存生成一个版本，上传失败时自动重试。','<p class="hint">正在读取发布状态…</p>');
  try{
    const response=await fetch('/api/archive-status',{cache:'no-store'});if(!response.ok)throw new Error('无法读取存档状态');
    const a=await response.json();if(modalState?.type!=='archive')return;
    const status=a.error ? a.error : !a.configured ? '已生成本地存档，等待配置 GitHub 发布凭据。' : a.pending ? `还有 ${a.pending} 个版本等待上传。` : '全部存档已上传到 GitHub。';
    openModal('静态存档与 GitHub 发布','记分网页负责编辑，GitHub Pages 展示只读快照。',`<div class="rules"><p>本地存档：${a.total} 份 · 最新 R${a.latestRevision ?? '—'}</p><p>GitHub 已上传：${a.publishedRevision===null?'暂无':`R${a.publishedRevision}`}</p><p>${esc(status)}</p><p class="hint">GitHub Pages 页面部署可能比上传晚几分钟。</p></div><div class="actions" style="margin-top:20px;flex-wrap:wrap"><a class="btn" href="/archive/index.html" target="_blank" rel="noopener">本地静态版 ↗</a><a class="btn" href="/archive/history.html" target="_blank" rel="noopener">历史存档 ↗</a>${a.pagesUrl?`<a class="btn primary" href="${esc(a.pagesUrl)}" target="_blank" rel="noopener">GitHub 网页 ↗</a>`:''}</div>`);
  }catch(e){if(modalState?.type==='archive')$('#form-error').textContent=e.message;}
}
</script></body></html>
